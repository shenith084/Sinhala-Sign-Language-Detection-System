augmentation:
  brightness_delta: 0.1
  contrast_range:
  - 0.9
  - 1.1
  frame_dropout_max: 0
  gaussian_blur_prob: 0.3
  horizontal_flip_prob: 0.5
  hue_delta: 0.0
  rotation_range_deg: 5
  saturation_range:
  - 1.0
  - 1.0
  speed_perturbation:
  - 0.9
  - 1.1
  temporal_jitter: true
  zoom_range:
  - 0.95
  - 1.05
colab:
  drive_mount: /content/drive
  project_drive_path: /content/drive/MyDrive/SSL400_Research
  sync_after_epochs: 1
dataset:
  clip_duration_sec: 3
  fps: 20
  num_classes: 8
  total_frames_per_clip: 60
  total_videos: 618
  video_extensions:
  - .mp4
  - .mov
enhancement:
  bilateral_d: 9
  bilateral_sigma_color: 75
  bilateral_sigma_space: 75
  clahe_clip_limit: 2.0
  clahe_tile_grid:
  - 8
  - 8
  gamma: 1.2
  hybrid_unsharp_amount: 1.0
  unsharp_amount: 1.5
  unsharp_kernel_size: 5
  unsharp_sigma: 1.0
experiments:
- id: 1
  label: EXP1_BASELINE
  log_dir: logs/experiment_1
  model_dir: models/experiment_1
  name: Baseline (No Enhancement)
  processed_dir: data/processed/exp1_baseline
  use_augmentation: false
- id: 2
  label: EXP2_CLAHE_GAMMA
  log_dir: logs/experiment_2
  model_dir: models/experiment_2
  name: CLAHE + Gamma Correction
  processed_dir: data/processed/exp2_clahe_gamma
  use_augmentation: true
- id: 3
  label: EXP3_BILATERAL_UNSHARP
  log_dir: logs/experiment_3
  model_dir: models/experiment_3
  name: Edge-Preserving Sharpening (Bilateral + Unsharp)
  processed_dir: data/processed/exp3_bilateral_unsharp
  use_augmentation: true
- id: 4
  label: EXP4_HYBRID
  log_dir: logs/experiment_4
  model_dir: models/experiment_4
  name: Hybrid (Bilateral + CLAHE + Unsharp)
  processed_dir: data/processed/exp4_hybrid
  use_augmentation: true
- id: 5
  label: EXP5_EFFICIENTNET_BILSTM
  log_dir: logs/experiment_5
  model_dir: models/experiment_5
  name: EfficientNetV2-S + BiLSTM + CLAHE
  processed_dir: data/processed/exp5_clahe_gamma
  use_augmentation: true
frames:
  channels: 3
  height: 224
  norm_mean: 127.5
  norm_std: 127.5
  num_frames: 32
  width: 224
live:
  confidence_threshold: 0.65
  font_path: assets/fonts/iskpota.ttf
  font_size: 28
  majority_vote_ratio: 0.6
  sentence_max_words: 10
  sentence_reset_timeout_sec: 3.0
  temporal_window_size: 5
model:
  backbone: MobileNetV3Large
  dropout_rate: 0.4
  input_shape:
  - 32
  - 224
  - 224
  - 3
  lstm_units: 512
paths:
  assets: assets
  logs: logs
  models: models
  processed: data/processed
  raw_dataset: data/raw
  results: results
  splits: data/splits
phase1:
  batch_size: 16
  early_stopping_patience: 15
  label_smoothing: 0.1
  learning_rate: 0.001
  lr_schedule: CosineDecay
  max_epochs: 30
  mixup_alpha: 0.2
  optimizer_clipnorm: 1.0
phase2:
  batch_size: 16
  early_stopping_patience: 25
  label_smoothing: 0.1
  learning_rate: 0.0001
  lr_schedule: CosineDecay
  max_epochs: 50
  mixup_alpha: 0.2
  optimizer_clipnorm: 1.0
project:
  name: SSL400 Sinhala Sign Language Research
  seed: 42
  version: 1.0.0
splits:
  seed: 42
  stratify: true
  test_ratio: 0.2
  train_ratio: 0.7
  val_ratio: 0.1
