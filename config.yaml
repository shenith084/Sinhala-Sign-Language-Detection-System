# ============================================================
# SSL400 Sinhala Sign Language Research Project
# config.yaml — Central configuration (all paths & hyperparameters)
# ============================================================

# --- Project Identity ---
project:
  name: "SSL400 Sinhala Sign Language Research"
  version: "1.0.0"
  seed: 42

# --- Dataset Paths ---
paths:
  raw_dataset:   "data/raw"                    # Original downloaded data
  processed:     "data/processed"              # Enhanced frame .npy files
  splits:        "data/splits"                 # CSV split files
  models:        "models"                      # Saved model checkpoints
  logs:          "logs"                        # Training CSV logs
  results:       "results"                     # Metrics + figures
  assets:        "assets"                      # Fonts etc.

# --- Dataset Configuration ---
dataset:
  num_classes: 8                    # Increased from 5 to 8 to make the problem harder
  total_videos: 785                 # Total videos in new dataset
  video_extensions: [".mp4", ".mov"]
  fps: 20                           # Videos recorded at 20 FPS
  clip_duration_sec: 3              # Each clip ~3 seconds
  total_frames_per_clip: 60         # 20 FPS × 3 sec = 60 frames

# --- Frame Processing ---
frames:
  num_frames: 32
  height: 224             # 224x224 — required for EfficientNetV2S (minimum 128, optimal 224+)
  width: 224
  channels: 3
  norm_mean: 127.5        # Normalize: (frame / 127.5) - 1.0
  norm_std: 127.5

# --- Data Split ---
splits:
  train_ratio: 0.70
  val_ratio: 0.10
  test_ratio: 0.20
  stratify: true
  seed: 42

# --- Model Architecture ---
model:
  backbone: "EfficientNetV2S"      # TimeDistributed backbone
  lstm_units: 512
  dropout_rate: 0.4
  input_shape: [32, 224, 224, 3]   # (frames, H, W, C)

# --- Training — Phase 1 (Frozen Backbone) ---
phase1:
  max_epochs: 30
  learning_rate: 0.001             # 1e-3
  batch_size: 2                    # Reduced to 2 for EfficientNetV2 on T4/P100
  early_stopping_patience: 15
  label_smoothing: 0.1
  mixup_alpha: 0.2                 # Re-enabled Mixup
  lr_schedule: "ReduceLROnPlateau"
  optimizer_clipnorm: 1.0

# --- Training — Phase 2 (Full Fine-Tune) ---
phase2:
  max_epochs: 50                   # Set to 50 epochs for fine-tuning
  learning_rate: 0.0001            # 1e-5 — reduced 10x to prevent catastrophic forgetting on unfreeze
  batch_size: 2                    # Reduced to 2 for EfficientNetV2 on T4/P100
  early_stopping_patience: 25      # Increased patience for longer training
  label_smoothing: 0.1
  mixup_alpha: 0.2                 # Re-enabled Mixup
  lr_schedule: "ReduceLROnPlateau"
  optimizer_clipnorm: 1.0

# --- Augmentation ---
augmentation:
  horizontal_flip_prob: 0.5        # ENABLED: Research confirmed all 8 Sinhala signs safe to flip (left-handed signers)
  rotation_range_deg: 5            # Reduced from 15 to keep hands in frame
  zoom_range: [0.95, 1.05]         # Reduced from 0.85-1.15 to keep hands in frame
  brightness_delta: 0.1            # Reduced for stability
  contrast_range: [0.9, 1.1]       # Reduced for stability
  hue_delta: 0.0                   # DISABLED: Causing underfitting on tiny dataset
  saturation_range: [1.0, 1.0]     # DISABLED: Causing underfitting on tiny dataset
  gaussian_blur_prob: 0.3          # ENABLED: Camera focus variation. IEEE/MDPI 2024 SLR standard augmentation.
  # Temporal
  temporal_jitter: true
  speed_perturbation: [0.9, 1.1]   # ENABLED (mild ±10%): Re-enabled for larger 618-video dataset. Time-warp for signer speed variance.
  frame_dropout_max: 0             # DISABLED: Causing underfitting on tiny dataset

# --- Enhancement Parameters ---
enhancement:
  # EXP2 — CLAHE + Gamma
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  gamma: 1.2
  # EXP3 — Edge-Preserving Sharpening (Bilateral + Unsharp)
  bilateral_d: 9
  bilateral_sigma_color: 75
  bilateral_sigma_space: 75
  unsharp_kernel_size: 5  # Renamed for script compatibility
  unsharp_sigma: 1.0
  unsharp_amount: 1.5
  # EXP4 — Hybrid (Bilateral + CLAHE + Unsharp)
  hybrid_unsharp_amount: 1.0

# --- Live Detection ---
live:
  confidence_threshold: 0.65
  temporal_window_size: 5
  majority_vote_ratio: 0.6
  sentence_max_words: 10
  sentence_reset_timeout_sec: 3.0
  font_path: "assets/fonts/iskpota.ttf"
  font_size: 28

# --- Experiments ---
experiments:
  - id: 1
    label: "EXP1_BASELINE"
    name: "Baseline (No Enhancement)"
    use_augmentation: false
    processed_dir: "data/processed/exp1_baseline"
    model_dir: "models/experiment_1"
    log_dir: "logs/experiment_1"

  - id: 2
    label: "EXP2_CLAHE_GAMMA"
    name: "CLAHE + Gamma Correction"
    use_augmentation: true
    processed_dir: "data/processed/exp2_clahe_gamma"
    model_dir: "models/experiment_2"
    log_dir: "logs/experiment_2"

  - id: 3
    label: "EXP3_BILATERAL_UNSHARP"
    name: "Edge-Preserving Sharpening (Bilateral + Unsharp)"
    use_augmentation: true
    processed_dir: "data/processed/exp3_bilateral_unsharp"
    model_dir: "models/experiment_3"
    log_dir: "logs/experiment_3"

  - id: 4
    label: "EXP4_HYBRID"
    name: "Hybrid (Bilateral + CLAHE + Unsharp)"
    use_augmentation: true
    processed_dir: "data/processed/exp4_hybrid"
    model_dir: "models/experiment_4"
    log_dir: "logs/experiment_4"

# --- Kaggle Environment ---
kaggle:
  working_dir: "/kaggle/working"
  input_dir: "/kaggle/input/ssl400-dataset"

# --- Google Drive (Colab) ---
colab:
  drive_mount: "/content/drive"
  project_drive_path: "/content/drive/MyDrive/SSL400_Research"
  sync_after_epochs: 1             # Sync to Drive every N epochs
