# ============================================================
# SSL400 Sinhala Sign Language Research Project
# config.yaml — Central configuration (all paths & hyperparameters)
# ============================================================

# --- Project Identity ---
project:
  name: "SSL400 Sinhala Sign Language Research"
  version: "1.0.0"
  seed: 42

# --- Dataset Paths ---
paths:
  raw_dataset:   "SSL400/Dataset - Original"  # Original downloaded data
  processed:     "data/processed"              # Enhanced frame .npy files
  splits:        "data/splits"                 # CSV split files
  models:        "models"                      # Saved model checkpoints
  logs:          "logs"                        # Training CSV logs
  results:       "results"                     # Metrics + figures
  assets:        "assets"                      # Fonts etc.

# --- Dataset Configuration ---
dataset:
  num_classes: 50                   # Reduced to Top 50 classes
  total_videos: 3209                # Total videos in dataset
  video_extensions: [".mp4", ".mov"]
  fps: 20                           # Videos recorded at 20 FPS
  clip_duration_sec: 3              # Each clip ~3 seconds
  total_frames_per_clip: 60         # 20 FPS × 3 sec = 60 frames

# --- Frame Processing ---
frames:
  num_frames: 32          # Restored to 32 for max GPU accuracy
  height: 224
  width: 224
  channels: 3
  norm_mean: 127.5        # Normalize: (frame / 127.5) - 1.0
  norm_std: 127.5

# --- Data Split ---
splits:
  train_ratio: 0.70
  val_ratio: 0.10
  test_ratio: 0.20
  stratify: true
  seed: 42

# --- Model Architecture ---
model:
  backbone: "MobileNetV3Large"     # TimeDistributed backbone
  lstm_units: 512
  dropout_rate: 0.4
  input_shape: [8, 224, 224, 3]    # (frames, H, W, C)

# --- Training — Phase 1 (Frozen Backbone) ---
phase1:
  max_epochs: 50
  learning_rate: 0.001             # 1e-3
  batch_size: 16                   # Increased to 16 for Colab A100 GPU
  early_stopping_patience: 15
  label_smoothing: 0.1
  mixup_alpha: 0.0
  lr_schedule: "CosineDecay"
  optimizer_clipnorm: 1.0

# --- Training — Phase 2 (Full Fine-Tune) ---
phase2:
  max_epochs: 30                   # Restored to full 30 epochs
  learning_rate: 0.00001           # 1e-5 — very careful fine-tuning
  batch_size: 16                   # Increased to 16 for Colab A100 GPU
  early_stopping_patience: 15
  label_smoothing: 0.1
  mixup_alpha: 0.0                 # No Mixup in Phase 2
  lr_schedule: "CosineDecay"
  optimizer_clipnorm: 1.0

# --- Augmentation ---
augmentation:
  horizontal_flip_prob: 0.5
  rotation_range_deg: 15
  zoom_range: [0.85, 1.15]
  brightness_delta: 0.2
  contrast_range: [0.8, 1.2]
  # Temporal
  temporal_jitter: true
  speed_perturbation: [0.8, 1.2]
  frame_dropout_max: 2

# --- Enhancement Parameters ---
enhancement:
  # EXP2 — CLAHE + Gamma
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  gamma: 1.2
  # EXP3 — Bilateral Filter
  bilateral_d: 9
  bilateral_sigma_color: 75
  bilateral_sigma_space: 75
  # EXP4 — Unsharp Masking
  unsharp_kernel: [5, 5]
  unsharp_sigma: 1.0
  unsharp_amount: 1.5
  unsharp_threshold: 0
  # EXP5 — Hybrid (moderate amounts)
  hybrid_unsharp_amount: 1.0

# --- Live Detection ---
live:
  confidence_threshold: 0.65
  temporal_window_size: 5
  majority_vote_ratio: 0.6
  sentence_max_words: 10
  sentence_reset_timeout_sec: 3.0
  font_path: "assets/fonts/iskpota.ttf"
  font_size: 28

# --- Experiments ---
experiments:
  - id: 1
    label: "EXP1_BASELINE"
    name: "Baseline (No Enhancement)"
    processed_dir: "data/processed/exp1_baseline"
    model_dir: "models/experiment_1"
    log_dir: "logs/experiment_1"

  - id: 2
    label: "EXP2_CLAHE_GAMMA"
    name: "CLAHE + Gamma Correction"
    processed_dir: "data/processed/exp2_clahe_gamma"
    model_dir: "models/experiment_2"
    log_dir: "logs/experiment_2"

  - id: 3
    label: "EXP3_BILATERAL"
    name: "Bilateral Filter"
    processed_dir: "data/processed/exp3_bilateral"
    model_dir: "models/experiment_3"
    log_dir: "logs/experiment_3"

  - id: 4
    label: "EXP4_UNSHARP"
    name: "Unsharp Masking"
    processed_dir: "data/processed/exp4_unsharp"
    model_dir: "models/experiment_4"
    log_dir: "logs/experiment_4"

  - id: 5
    label: "EXP5_HYBRID"
    name: "Hybrid (Bilateral + CLAHE + Unsharp)"
    processed_dir: "data/processed/exp5_hybrid"
    model_dir: "models/experiment_5"
    log_dir: "logs/experiment_5"

# --- Google Drive (Colab) ---
colab:
  drive_mount: "/content/drive"
  project_drive_path: "/content/drive/MyDrive/SSL400_Research"
  sync_after_epochs: 1             # Sync to Drive every N epochs
